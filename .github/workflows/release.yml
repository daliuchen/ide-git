name: Release

# Every merge to main runs this, but it only publishes when package.json has a version that has
# no `v<version>` tag yet. To release, bump the version (and CHANGELOG.md) in a pull request.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Check for a new version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compare package.json with existing tags
        id: version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "v$VERSION is already released; nothing to publish."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Test and package
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Unit tests
        run: pnpm run test:unit

      - name: VS Code 1.85.2 integration tests
        run: xvfb-run -a pnpm run test:integration

      - name: Package VSIX
        run: pnpm run package

      - name: Check the package
        shell: bash
        run: |
          VSIX="ide-git-${{ needs.check.outputs.version }}.vsix"
          test -f "$VSIX" || { echo "Expected $VSIX" >&2; ls *.vsix >&2; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: ide-git-${{ needs.check.outputs.version }}.vsix
          if-no-files-found: error
          retention-days: 7

  github-release:
    name: Tag and GitHub Release
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: vsix

      - name: Release notes from CHANGELOG.md
        shell: bash
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          awk -v heading="## $VERSION" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [[ ! -s notes.md ]]; then
            echo "CHANGELOG.md has no section for $VERSION." >&2
            exit 1
          fi

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "v${{ needs.check.outputs.version }}"
          "ide-git-${{ needs.check.outputs.version }}.vsix"
          --repo "${{ github.repository }}"
          --target "${{ github.sha }}"
          --title "v${{ needs.check.outputs.version }}"
          --notes-file notes.md

  open-vsx:
    name: Publish to Open VSX
    needs: [check, build, github-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted publishing: the job's OIDC token is exchanged for a short-lived Open VSX token.
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: vsix

      - name: Publish
        env:
          # Only needed for the very first release, before a trusted publisher can be registered.
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        shell: bash
        run: |
          VSIX="ide-git-${{ needs.check.outputs.version }}.vsix"
          if [[ -n "$OVSX_PAT" ]]; then
            npx --yes ovsx@1.3.0 publish "$VSIX"
          else
            npx --yes ovsx@1.3.0 publish "$VSIX" --trusted-publishing
          fi
