name: Feature request
description: Suggest something IDE Git should do.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: English or 中文 are both fine.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you would like it to work. If an IDE does this well, describe or screenshot how it behaves there.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: How do you work around it now?
